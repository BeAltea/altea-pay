# TEMPLATE — valores reais aplicados no bootstrap (NUNCA commitar segredos).
# Em local-postgres, LOCAL_SUPABASE_* apontam para o Supabase self-hosted local
# (ou os mesmos nomes padrão apontados ao stack local). Ver docs/db-local-strategy.md.
apiVersion: v1
kind: Secret
metadata:
  name: alteapay-app-secrets
  namespace: alteapay-app
  labels: { app.kubernetes.io/part-of: alteapay }
type: Opaque
stringData:
  NEXT_PUBLIC_SUPABASE_URL: "PLACEHOLDER"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "PLACEHOLDER"
  SUPABASE_SERVICE_ROLE_KEY: "PLACEHOLDER"
  LOCAL_SUPABASE_URL: "PLACEHOLDER"
  LOCAL_SUPABASE_ANON_KEY: "PLACEHOLDER"
  LOCAL_SUPABASE_SERVICE_ROLE_KEY: "PLACEHOLDER"
  POSTGRES_PASSWORD: "altea"
  ASAAS_API_KEY: "PLACEHOLDER"
  ASAAS_WEBHOOK_TOKEN: "PLACEHOLDER"
  SENDGRID_API_KEY: "PLACEHOLDER"
  WHATSAPP_ACCESS_TOKEN: "PLACEHOLDER"
  WHATSAPP_APP_SECRET: "PLACEHOLDER"
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: "PLACEHOLDER"
