apiVersion: v1
kind: ConfigMap
metadata:
  name: alteapay-app-config
  namespace: alteapay-app
  labels: { app.kubernetes.io/part-of: alteapay }
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  # Contrato D: deploy local usa Postgres local via Supabase self-hosted.
  # Ver docs/db-local-strategy.md. Em produção (Netlify) DATABASE_TARGET=supabase.
  DATABASE_TARGET: "local-postgres"
  # Redis in-cluster para as filas da app (BullMQ).
  REDIS_URL: "redis://redis.alteapay-app.svc.cluster.local:6379"
  # Postgres local (StatefulSet postgres-app). Usado pelo acesso SQL direto
  # (lib/db/pg.ts) e por scripts/migrações.
  DATABASE_URL: "postgres://altea:altea@postgres-app.alteapay-app.svc.cluster.local:5432/alteapay"
  # Integrações em modo mock no cluster local (sem tocar produção).
  ASAAS_MODE: "mock"
  SENDGRID_MODE: "mock"
  ASSERTIVA_MODE: "mock"
