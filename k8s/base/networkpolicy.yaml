# Ingress default-deny + allow explícito para o web. Egress é mantido aberto
# nesta fase para não quebrar o bring-up local (app -> postgres-app/redis e, em
# modo supabase, APIs externas via 443). Endurecer egress é trabalho futuro
# (registrado em docs/lacunas-roadmap-v1.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: alteapay-app
  labels: { app.kubernetes.io/part-of: alteapay }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: alteapay-app
  labels: { app.kubernetes.io/part-of: alteapay }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: alteapay-web } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ protocol: TCP, port: 3000 }]
---
# Permite que web/workers (mesma ns) acessem postgres-app e redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace-datastores
  namespace: alteapay-app
  labels: { app.kubernetes.io/part-of: alteapay }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [postgres-app, redis] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
